name: Chrome Web Store

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  submit:
    # Standard hosted runners are free for public repositories.
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test
        run: |
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_webstore.py' -v
      - name: Package with a stable version for this main commit
        run: |
          STORE_REVISION=$(git rev-list --first-parent --count HEAD)
          python3 scripts/webstore.py package --revision "$STORE_REVISION"
      - name: Submit update for review
        if: vars.CWS_ENABLED == 'true' && github.ref == 'refs/heads/main'
        env:
          CWS_PUBLISHER_ID: 086c7f23-71df-4cf3-b214-b6f6a51f14b7
          CWS_EXTENSION_ID: akfmjlfeanibkgichgmfpnmjlekacmfl
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/webstore.py publish | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Explain pending account setup
        if: vars.CWS_ENABLED != 'true'
        run: echo 'Store submission is disabled. Complete store/automation.md and set CWS_ENABLED=true.' >> "$GITHUB_STEP_SUMMARY"
